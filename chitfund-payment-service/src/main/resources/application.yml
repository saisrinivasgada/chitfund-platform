spring:
  application:
    name: payment-service

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chitfund_payment}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:chitfund}
    password: ${DB_PASSWORD:chitfund_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: VARCHAR

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-south-1}

server:
  port: 8084

jwt:
  secret: ${JWT_SECRET:chitfund-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm}

app:
  internal-key: ${INTERNAL_SERVICE_KEY:chitfund-internal-service-key}
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  member-service-url: ${MEMBER_SERVICE_URL:http://localhost:8083}
  chit-service-url: ${CHIT_SERVICE_URL:http://localhost:8082}
  payout-service-url: ${PAYOUT_SERVICE_URL:http://localhost:8085}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}

whatsapp:
  enabled: ${WHATSAPP_ENABLED:false}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:NOT_CONFIGURED}
  access-token: ${WHATSAPP_ACCESS_TOKEN:NOT_CONFIGURED}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.chitfund: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

chitwise:
  events:
    # Deploy inbox consumers first, then explicitly switch through DUAL to OUTBOX.
    mode: ${CHITWISE_EVENTS_MODE:LEGACY}
    relay-enabled: ${CHITWISE_EVENTS_RELAY_ENABLED:true}
    relay-delay-ms: ${CHITWISE_EVENTS_RELAY_DELAY_MS:2000}
    batch-size: ${CHITWISE_EVENTS_BATCH_SIZE:100}
    max-attempts: ${CHITWISE_EVENTS_MAX_ATTEMPTS:10}
    lease-duration: ${CHITWISE_EVENTS_LEASE_DURATION:30s}
    retention-enabled: ${CHITWISE_EVENTS_RETENTION_ENABLED:false}
    retention-days: ${CHITWISE_EVENTS_RETENTION_DAYS:90}
    retention-batch-size: ${CHITWISE_EVENTS_RETENTION_BATCH_SIZE:1000}
  money:
    admin-wallet:
      reconciliation-enabled: ${CHITWISE_ADMIN_WALLET_PAISE_RECONCILIATION_ENABLED:true}
      reconciliation-delay-ms: ${CHITWISE_ADMIN_WALLET_PAISE_RECONCILIATION_DELAY_MS:60000}
      # Enable only after every row has been backfilled and every running app
      # version dual-writes. Missing rows then become release-blocking.
      require-complete: ${CHITWISE_ADMIN_WALLET_PAISE_REQUIRE_COMPLETE:false}
