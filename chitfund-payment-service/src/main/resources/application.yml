spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chitfund_payment}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:chitfund}
    password: ${DB_PASSWORD:chitfund_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: VARCHAR

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-south-1}

server:
  port: 8084

jwt:
  secret: ${JWT_SECRET:chitfund-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm}

app:
  internal-key: ${INTERNAL_SERVICE_KEY:chitfund-internal-service-key}
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  member-service-url: ${MEMBER_SERVICE_URL:http://localhost:8083}
  chit-service-url: ${CHIT_SERVICE_URL:http://localhost:8082}
  payout-service-url: ${PAYOUT_SERVICE_URL:http://localhost:8085}

whatsapp:
  enabled: ${WHATSAPP_ENABLED:false}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:NOT_CONFIGURED}
  access-token: ${WHATSAPP_ACCESS_TOKEN:NOT_CONFIGURED}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.chitfund: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
