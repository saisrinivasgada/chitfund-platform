spring:
  application:
    name: reporting-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chitfund_reporting}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:chitfund}
    password: ${DB_PASSWORD:chitfund_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 3

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: VARCHAR

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-2}
      sqs:
        listener:
          poll-timeout: PT20S

server:
  port: 8087

jwt:
  secret: ${JWT_SECRET:chitfund-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm}

reporting:
  internal-key: ${INTERNAL_SERVICE_KEY:chitfund-internal-service-key}

user-service:
  url: ${USER_SERVICE_URL:http://user-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.chitfund: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
