# ─── hub.thechitwise.com — ChitWise internal staff portal ───────────────────
server {
    listen 443 ssl;
    server_name hub.thechitwise.com;

    ssl_certificate     /etc/letsencrypt/live/thechitwise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thechitwise.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root  /var/www/chitfund;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/support/ {
        proxy_pass http://127.0.0.1:8091/ws/support/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── Redirect HTTP → HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    server_name thechitwise.com www.thechitwise.com chitwise.app www.chitwise.app 3.21.196.51 _;
    return 301 https://$host$request_uri;
}

# ─── Main domain HTTPS (super-admin, landing page, no-subdomain access) ──────
server {
    listen 443 ssl;
    server_name thechitwise.com www.thechitwise.com chitwise.app www.chitwise.app 3.21.196.51;

    ssl_certificate     /etc/letsencrypt/live/thechitwise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thechitwise.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root  /var/www/chitfund;
    index index.html;

    # API proxy — no tenant slug injection on main domain
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy for STOMP/SockJS (notification-service)
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket proxy for support-service
    location /ws/support/ {
        proxy_pass http://127.0.0.1:8091/ws/support/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── Wildcard subdomains HTTPS: <slug>.thechitwise.com and <slug>.chitwise.app ─
server {
    listen 443 ssl;
    server_name ~^(?<tenant_slug>[^.]+)\.(thechitwise\.com|chitwise\.app)$;

    ssl_certificate     /etc/letsencrypt/live/thechitwise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thechitwise.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root  /var/www/chitfund;
    index index.html;

    # API proxy — inject X-Tenant-Slug from subdomain
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug     $tenant_slug;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy for STOMP/SockJS
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant-Slug     $tenant_slug;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
