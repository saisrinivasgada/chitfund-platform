# ─── Main domain (super-admin, landing page, no-subdomain access) ─────────────
server {
    listen 80;
    server_name thechitwise.com www.thechitwise.com chitwise.app www.chitwise.app 3.21.196.51 _;

    root /var/www/chitfund;
    index index.html;

    # API proxy — no tenant slug injection on main domain
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy for STOMP/SockJS
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── Wildcard subdomains: <slug>.thechitwise.com and <slug>.chitwise.app ────────
server {
    listen 80;
    server_name ~^(?<tenant_slug>[^.]+)\.(thechitwise\.com|chitwise\.app)$;

    root /var/www/chitfund;
    index index.html;

    # API proxy — inject X-Tenant-Slug from subdomain so user-service can
    # auto-resolve the tenant context for login requests (before JWT is issued).
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug     $tenant_slug;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy for STOMP/SockJS
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Tenant-Slug     $tenant_slug;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — same React build serves all tenant subdomains
    location / {
        try_files $uri $uri/ /index.html;
    }
}
