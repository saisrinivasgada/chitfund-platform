appId: com.chitwise.mobile
---
- launchApp
- openLink: 'chitwise:///(auth)/accounts'
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Switch Account"
    timeout: 60000
- extendedWaitUntil:
    visible: "No collections waiting to sync|.*saved.*waiting to sync|.*collection.*review|Syncing saved collections.*|Data download paused|Downloading offline data.*"
    timeout: 60000
- assertVisible:
    id: "sync-account-offline-a"
