appId: com.chitwise.mobile
---
- launchApp
- openLink: 'chitwise:///(auth)/login?addAccount=1&username=offline-a'
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Enter your password"
    timeout: 60000
- tapOn: "Enter your password"
- inputText: "local-qa-only"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Dashboard|Welcome to ChitWise"
    timeout: 60000
- tapOn:
    text: "No thanks"
    optional: true
- tapOn:
    text: "Skip for now"
    optional: true
- openLink: 'chitwise:///(auth)/accounts'
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "No collections waiting to sync"
    timeout: 60000
- assertNotVisible: ".*1 saved.*waiting to sync.*"
