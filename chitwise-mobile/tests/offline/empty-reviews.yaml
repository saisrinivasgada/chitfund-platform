appId: com.chitwise.mobile
---
- launchApp
- runFlow: wait-for-restored-screen.yaml
- runFlow:
    file: open-app-route.yaml
    env:
      APP_LINK: 'chitwise:///(app)/(admin)/payments?tab=Record%20Payment'
- waitForAnimationToEnd
# Native iOS routes open directly. If a platform shows a link confirmation,
# handle it, then require the actual payment screen.
- extendedWaitUntil:
    visible: 'Open in .*ChitWise.*|Select Member'
    timeout: 60000
- runFlow:
    when:
      visible: 'Open in .*ChitWise.*'
    commands:
      - tapOn: 'Open'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "member-row-QA Member A"
    timeout: 60000
- assertNotVisible: "Offline collection reviews.*"
- tapOn:
    id: "sync-status-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sync now"
    timeout: 10000
- tapOn: "Sync now"
- extendedWaitUntil:
    visible: "Available offline"
    timeout: 60000
- tapOn: "Close sync details"
- waitForAnimationToEnd
- tapOn:
    id: "chitwise-tools-button"
- assertVisible: "CHITWISE TOOLS"
- tapOn: "Open calculator"
- assertVisible: "AC"
- tapOn: "Close calculator"
