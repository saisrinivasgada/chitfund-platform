appId: com.chitwise.mobile
---
- launchApp
- runFlow: wait-for-restored-screen.yaml
- openLink: 'chitwise:///(app)/(admin)/payments?tab=Record%20Payment'
- waitForAnimationToEnd
# A new iOS simulator may show its first-link confirmation after openLink
# returns. Wait for the prompt OR the destination before attempting the tap.
- extendedWaitUntil:
    visible: 'Open in .*ChitWise.*|Select Member'
    timeout: 60000
- runFlow:
    when:
      visible: 'Open in .*ChitWise.*'
    commands:
      - tapOn: 'Open'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Select Member"
    timeout: 60000
- assertNotVisible: "Offline collection reviews.*"
- tapOn:
    id: "sync-status-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sync now"
    timeout: 10000
- tapOn: "Sync now"
- extendedWaitUntil:
    visible: "Available offline"
    timeout: 60000
- tapOn: "Close sync details"
- waitForAnimationToEnd
- tapOn:
    id: "chitwise-tools-button"
- assertVisible: "CHITWISE TOOLS"
- tapOn: "Open calculator"
- assertVisible: "AC"
- tapOn: "Close calculator"
