appId: com.chitwise.mobile
---
# iOS can display its credential-saving prompt after navigation has finished.
# Dismiss only this idempotent prompt; destination/financial assertions still fail.
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: 3
          commands:
            - tapOn:
                text: "Not Now|Not now"
                optional: true
                retryTapIfNoChange: true
      - extendedWaitUntil:
          notVisible: "Save Password.*"
          timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Not Now|Not now"
          optional: true
          retryTapIfNoChange: true
