appId: com.chitwise.mobile
env:
  QA_URL: http://127.0.0.1:3112
---
- runFlow:
    when:
      platform: iOS
    commands:
      - runScript: open-app-route.js
      # simctl returns before iOS has presented its external-link confirmation.
      # An optional early tap can miss the prompt and strand the next assertion.
      - extendedWaitUntil:
          visible: 'Open in .*ChitWise.*'
          timeout: 60000
      - tapOn: "Open"
      - extendedWaitUntil:
          notVisible: 'Open in .*ChitWise.*'
          timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: ${APP_LINK}
