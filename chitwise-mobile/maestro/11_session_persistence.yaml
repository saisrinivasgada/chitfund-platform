appId: ${APP_ID}
name: Session Persistence — sign-in survives app close/reopen
---
- launchApp
- waitForAnimationToEnd

# Login if not already signed in
- runFlow:
    when:
      visible:
        text: "Sign In"
    commands:
      - tapOn:
          text: "Enter your username"
      - inputText: ${ADMIN_USERNAME}
      - pressKey: Enter
      - tapOn:
          text: "Enter your password"
      - inputText: ${ADMIN_PASSWORD}
      - pressKey: Enter
      - waitForAnimationToEnd
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: "Verify your identity"
          commands:
            - waitForAnimationToEnd
            - runScript: helpers/read_otp.js
            - tapOn:
                text: "123456"
            - inputText: ${output.otp}
            - tapOn:
                text: "Verify & Sign In"
            - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Select Organisation"
    commands:
      - tapOn:
          index: 0
          text: "›"
      - waitForAnimationToEnd

# Verify we're on the Dashboard before closing
- extendedWaitUntil:
    visible:
      text: "Dashboard"
    timeout: 15000

# Simulate closing the app completely (not just backgrounding)
- stopApp
- waitForAnimationToEnd

# Reopen the app
- launchApp
- waitForAnimationToEnd
- waitForAnimationToEnd

# Session should be restored — Dashboard visible without login
- extendedWaitUntil:
    visible:
      text: "Dashboard"
    timeout: 15000

# Confirm no Sign In screen appeared
- assertNotVisible:
    text: "Sign In"
