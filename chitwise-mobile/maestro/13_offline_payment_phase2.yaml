appId: ${APP_ID}
name: Offline Payment — Phase 2 (session and queue persist across restart)
---
# Relaunch WITHOUT clearState to verify session and queue persist
- launchApp:
    clearState: false
- waitForAnimationToEnd

# Must land on Dashboard — session survived the restart
- extendedWaitUntil:
    visible:
      text: "Dashboard"
    timeout: 15000

# Dashboard retries its payment-backed summary while the service is unavailable.
# Wait through that bounded network timeout and then prove the durable queue reappears.
- extendedWaitUntil:
    visible:
      text: "1 payment waiting.*"
    timeout: 30000

# Payment service is still down here — verify indicator stays amber (not red)
- assertNotVisible:
    text: "Sync needs attention"
- assertNotVisible:
    text: "Login required"
