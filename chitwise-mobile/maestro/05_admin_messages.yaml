appId: ${APP_ID}
name: Admin Messages — Navigate from More
---
- launchApp
- waitForAnimationToEnd

- runFlow:
    when:
      visible:
        text: "Sign In"
    commands:
      - tapOn:
          text: "Enter your username"
      - inputText: ${ADMIN_USERNAME}
      - pressKey: Enter
      - tapOn:
          text: "Enter your password"
      - inputText: ${ADMIN_PASSWORD}
      - pressKey: Enter
      - waitForAnimationToEnd
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible:
              text: "Verify your identity"
          commands:
            - waitForAnimationToEnd
            - runScript: helpers/read_otp.js
            - tapOn:
                text: "123456"
            - inputText: ${output.otp}
            - tapOn:
                text: "Verify & Sign In"
            - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Select Organisation"
    commands:
      - tapOn:
          index: 0
          text: "›"
      - waitForAnimationToEnd

- tapOn:
    point: "90%,94%"
- waitForAnimationToEnd
- tapOn:
    text: "Messages"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Messages"
    timeout: 8000
