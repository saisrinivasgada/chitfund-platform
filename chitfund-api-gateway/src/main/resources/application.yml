server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "https://app.thechitwise.com"
              - "https://hub.thechitwise.com"
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "*"
      routes:

        # ── User Service ─────────────────────────────────────────────────────
        # Controllers live at /api/auth/** and /api/users/** — no path stripping needed.
        - id: user-service-public
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: user-service-plans-protected
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/plans/upgrade-request,/api/plans/renewal-request
            - Method=POST
          filters:
            - JwtAuthGatewayFilter

        - id: user-service-plans-public
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/plans/**

        - id: user-service-public-endpoints
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/public/**

        # ── Support Service ───────────────────────────────────────────────────
        # Org admin ticket endpoints — gateway validates ORG JWT, forwards headers
        - id: management-service-org-tickets
          uri: ${MANAGEMENT_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/tickets/**
          filters:
            - JwtAuthGatewayFilter

        # Hub employee endpoints — NO gateway JWT filter; management-service validates HUB JWT
        - id: management-service-hub
          uri: ${MANAGEMENT_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/hub/**

        # Intra-org conversation endpoints — gateway validates org JWT, forwards headers
        - id: management-service-conversations
          uri: ${MANAGEMENT_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/conversations/**
          filters:
            - JwtAuthGatewayFilter

        # Group chat endpoints — gateway validates org JWT, forwards headers
        - id: management-service-groups
          uri: ${MANAGEMENT_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/groups/**
          filters:
            - JwtAuthGatewayFilter

        # Support WebSocket — no JWT filter at gateway; service validates on STOMP CONNECT
        - id: management-service-websocket
          uri: ${MANAGEMENT_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/ws/support/**

        - id: user-service-protected
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
          filters:
            - JwtAuthGatewayFilter

        - id: user-service-super-admin
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/super-admin/**
          filters:
            - JwtAuthGatewayFilter

        - id: user-service-billing
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/billing/**
          filters:
            - JwtAuthGatewayFilter

        # ── Chit Service ──────────────────────────────────────────────────────
        # Controllers live at /api/chits/** — no stripping.
        - id: chit-service
          uri: ${CHIT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/chits/**
          filters:
            - JwtAuthGatewayFilter

        # ── Member Service ────────────────────────────────────────────────────
        # Controller: /members/**  External: /api/members/**  → strip /api
        - id: member-service
          uri: ${MEMBER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/members/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        # ── Payment Service ───────────────────────────────────────────────────
        # Settlement: controller at /settlement/** — strip /api prefix like other payment routes.
        - id: payment-service-settlement
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/settlement/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        # Controllers: /payments/**, /admin/draws/**  External: /api/payments/**, /api/admin/**
        - id: payment-service-payments
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        - id: payment-service-admin
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/admin/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        # Notification endpoints — in-app notifications (mine, unread-count, mark-read)
        # Routes to notification-service on port 8086 (was wrongly pointing to payment-service)
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        # Auction SockJS/STOMP endpoint. The chit-service validates the JWT on
        # STOMP CONNECT and authorizes the tenant on SUBSCRIBE.
        - id: chit-service-auction-websocket
          uri: ${CHIT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/ws/auction/**

        # WebSocket — SockJS + STOMP (web); native WebSocket (mobile); no JWT filter
        - id: websocket
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/ws/**

        - id: websocket-native
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/ws-native/**

        # ── Payout Service ────────────────────────────────────────────────────
        # Controller: /payouts/**  External: /api/payouts/**
        - id: payout-service
          uri: ${PAYOUT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/payouts/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        # ── Reporting Service ─────────────────────────────────────────────────
        # Controller: /reports/**  External: /api/reports/**
        - id: reporting-service
          uri: ${REPORTING_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/reports/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        # ── Audit Service ─────────────────────────────────────────────────────
        # Controller: /audit/**  External: /api/audit/**
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/audit/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET}

internal:
  service:
    key: ${INTERNAL_SERVICE_KEY}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.chitfund.gateway: DEBUG
