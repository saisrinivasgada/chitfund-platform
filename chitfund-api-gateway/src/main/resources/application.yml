server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "*"
      routes:

        # ── User Service ─────────────────────────────────────────────────────
        # Controllers live at /api/auth/** and /api/users/** — no path stripping needed.
        - id: user-service-public
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: user-service-protected
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
          filters:
            - JwtAuthGatewayFilter

        # ── Chit Service ──────────────────────────────────────────────────────
        # Controllers live at /api/chits/** — no stripping.
        - id: chit-service
          uri: ${CHIT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/chits/**
          filters:
            - JwtAuthGatewayFilter

        # ── Member Service ────────────────────────────────────────────────────
        # Controller: /members/**  External: /api/members/**  → strip /api
        - id: member-service
          uri: ${MEMBER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/members/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        # ── Payment Service ───────────────────────────────────────────────────
        # Controllers: /payments/**, /admin/draws/**  External: /api/payments/**, /api/admin/**
        - id: payment-service-payments
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        - id: payment-service-admin
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/admin/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        # Notification endpoints — controller lives at /notifications/**
        - id: payment-service-notifications
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        # ── Payout Service ────────────────────────────────────────────────────
        # Controller: /payouts/**  External: /api/payouts/**
        - id: payout-service
          uri: ${PAYOUT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/payouts/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        # ── Reporting Service ─────────────────────────────────────────────────
        # Controller: /reports/**  External: /api/reports/**
        - id: reporting-service
          uri: ${REPORTING_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/reports/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

        # ── Audit Service ─────────────────────────────────────────────────────
        # Controller: /audit/**  External: /api/audit/**
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/audit/**
          filters:
            - JwtAuthGatewayFilter
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:chitfund-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.chitfund.gateway: DEBUG
