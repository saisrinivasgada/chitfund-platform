version: '3.8'

# Production Docker Compose for Chit Fund Platform
# Images are built on GitHub Actions and pushed to GHCR.
# Deploy on EC2: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d

x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
  AWS_REGION: us-east-2
  # Activates fail-fast production secret validation in every backend service.
  # Keep this in the shared environment so a newly added service cannot
  # accidentally deploy using permissive development defaults.
  SPRING_PROFILES_ACTIVE: prod

x-db-env: &db-env
  DB_HOST: ${DB_HOST}
  DB_PORT: 3306
  DB_USERNAME: chitfund
  DB_PASSWORD: ${DB_PASSWORD}

services:

  # ── API Gateway ─────────────────────────────────────────────────────────────
  api-gateway:
    image: ghcr.io/saisrinivasgada/api-gateway:latest
    container_name: chitfund-api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      USER_SERVICE_URL: http://user-service:8081
      CHIT_SERVICE_URL: http://chit-service:8082
      MEMBER_SERVICE_URL: http://member-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      PAYOUT_SERVICE_URL: http://payout-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      AUDIT_SERVICE_URL: http://audit-service:8088
      REPORTING_SERVICE_URL: http://reporting-service:8087
      MANAGEMENT_SERVICE_URL: http://management-service:8091
      RATE_LIMIT_ENABLED: "true"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    depends_on:
      user-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
      chit-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      payout-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    # Without this, 'compose up --wait' considers the gateway healthy as soon as
    # the container is running. It is the only entry point to every service, so a
    # gateway that starts but cannot serve passes the deploy and surfaces as a 502
    # in production instead — which is exactly what happened on 2026-09-09.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    restart: unless-stopped
    networks:
      - chitfund-net

  # ── User Service ─────────────────────────────────────────────────────────────
  user-service:
    image: ghcr.io/saisrinivasgada/user-service:latest
    container_name: chitfund-user-service
    environment:
      <<: [*common-env, *db-env]
      DB_NAME: chitfund_user
      MANAGEMENT_SERVICE_URL: http://management-service:8091
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    restart: unless-stopped
    networks:
      - chitfund-net

  # ── Member Service ───────────────────────────────────────────────────────────
  member-service:
    image: ghcr.io/saisrinivasgada/member-service:latest
    container_name: chitfund-member-service
    environment:
      <<: [*common-env, *db-env]
      DB_NAME: chitfund_member
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    restart: unless-stopped
    networks:
      - chitfund-net

  # ── Chit Service ─────────────────────────────────────────────────────────────
  chit-service:
    image: ghcr.io/saisrinivasgada/chit-service:latest
    container_name: chitfund-chit-service
    environment:
      <<: [*common-env, *db-env]
      DB_NAME: chitfund_chit
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      AUDIT_SERVICE_URL: http://audit-service:8088
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    restart: unless-stopped
    networks:
      - chitfund-net

  # ── Payment Service ───────────────────────────────────────────────────────────
  payment-service:
    image: ghcr.io/saisrinivasgada/payment-service:latest
    container_name: chitfund-payment-service
    environment:
      <<: [*common-env, *db-env]
      DB_NAME: chitfund_payment
      MEMBER_SERVICE_URL: http://member-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-NOT_CONFIGURED}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-NOT_CONFIGURED}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    restart: unless-stopped
    networks:
      - chitfund-net

  # ── Payout Service ────────────────────────────────────────────────────────────
  payout-service:
    image: ghcr.io/saisrinivasgada/payout-service:latest
    container_name: chitfund-payout-service
    environment:
      <<: [*common-env, *db-env]
      DB_NAME: chitfund_payout
      PAYMENT_SERVICE_URL: http://payment-service:8084
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    restart: unless-stopped
    networks:
      - chitfund-net

  # ── Notification Service ─────────────────────────────────────────────────────
  notification-service:
    image: ghcr.io/saisrinivasgada/notification-service:latest
    container_name: chitfund-notification-service
    environment:
      <<: [*common-env, *db-env]
      DB_NAME: chitfund_notification
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      NOTIFICATION_SENDER_MODE: ${NOTIFICATION_SENDER_MODE:-LOGGING}
      MEMBER_SERVICE_URL: http://member-service:8083
      USER_SERVICE_URL: http://user-service:8081
      CHIT_SERVICE_URL: http://chit-service:8082
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    restart: unless-stopped
    networks:
      - chitfund-net

  # ── Audit Service ─────────────────────────────────────────────────────────────
  audit-service:
    image: ghcr.io/saisrinivasgada/audit-service:latest
    container_name: chitfund-audit-service
    environment:
      <<: [*common-env, *db-env]
      DB_NAME: chitfund_audit
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    restart: unless-stopped
    networks:
      - chitfund-net

  # ── Reporting Service ────────────────────────────────────────────────────────
  reporting-service:
    image: ghcr.io/saisrinivasgada/reporting-service:latest
    container_name: chitfund-reporting-service
    environment:
      <<: [*common-env, *db-env]
      DB_NAME: chitfund_reporting
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      USER_SERVICE_URL: http://user-service:8081
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - chitfund-net

  # ── Redis (cache for management-service) ─────────────────────────────────────
  # In prod, replace with AWS ElastiCache URL via REDIS_URL env var and remove this block.
  redis:
    image: redis:7-alpine
    container_name: chitwise-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Bound to loopback: this Redis has no password, so publishing it on all
    # interfaces leaves only the security group between it and the internet.
    # Containers reach it over the compose network, not the host port.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - chitfund-net

  # ── Management Service ───────────────────────────────────────────────────────
  management-service:
    image: ghcr.io/saisrinivasgada/management-service:latest
    container_name: chitwise-management-service
    environment:
      <<: [*common-env, *db-env]
      DB_NAME: chitwise_management
      MANAGEMENT_JWT_SECRET: ${MANAGEMENT_JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: https://thechitwise.com
      HUB_URL: https://hub.thechitwise.com
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    # Published on all interfaces deliberately — do not "harden" this to
    # 127.0.0.1 without asking. External access is already blocked by the
    # security group, which only opens 80, 443, 8080 and 22.
    ports:
      # Nginx runs on the host, so retain access only through loopback.
      - "127.0.0.1:8091:8091"
    depends_on:
      # Now that redis reports health, wait for it to actually accept
      # connections rather than merely exist.
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    restart: unless-stopped
    networks:
      - chitfund-net

networks:
  chitfund-net:
    driver: bridge
