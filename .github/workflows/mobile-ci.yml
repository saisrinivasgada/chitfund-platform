name: Mobile CI

on:
  push:
    branches: [main, test]
    paths:
      - 'chitwise-mobile/**'
      - 'shared/offline/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, test]
    paths:
      - 'chitwise-mobile/**'
      - 'shared/offline/**'
      - '.github/workflows/mobile-ci.yml'

defaults:
  run:
    working-directory: chitwise-mobile

jobs:
  type-check:
    name: TypeScript & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: chitwise-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Offline policy and recovery checks
        run: npm run offline:policy:test && node --test ../shared/offline/*.test.mjs

      - name: TypeScript type-check
        run: npm run type-check

      - name: Dependency security audit
        # Fails on every Critical or unknown High advisory. The script contains
        # narrow, version-pinned, expiring exceptions for two Expo SDK 54
        # build-tool advisories that have no compatible vendor fix.
        run: npm run audit:test && npm run audit:ci
        continue-on-error: false

      - name: Expo Doctor
        # Pinned in devDependencies so compatibility checks are reproducible.
        run: npm run doctor

      - name: Export ChitWise iOS bundle
        run: npx expo export --platform ios --clear --output-dir "$RUNNER_TEMP/chitwise-ios"

      - name: Export ChitWise Android bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/chitwise-android"

      - name: Export ChitWise Hub iOS bundle
        env:
          EXPO_PUBLIC_APP_VARIANT: hub
        run: npx expo export --platform ios --clear --output-dir "$RUNNER_TEMP/chitwise-hub-ios"

      - name: Export ChitWise Hub Android bundle
        env:
          EXPO_PUBLIC_APP_VARIANT: hub
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/chitwise-hub-android"
