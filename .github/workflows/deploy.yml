name: Chit Fund Platform CI/CD

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

env:
  EC2_USER: ec2-user
  APP_DIR: /app

jobs:

  # ── Job 1: Build Check (runs on test branch push + PR to main) ─────────────
  # Catches broken code BEFORE it ever reaches production
  build:
    name: Build & Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile all backend services
        run: |
          mvn -pl chitfund-common,chitfund-user-service,chitfund-chit-service,chitfund-payment-service,chitfund-payout-service,chitfund-api-gateway \
            -am compile -q --no-transfer-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chitfund-frontend/package-lock.json

      - name: Build React frontend
        working-directory: chitfund-frontend
        run: |
          npm ci
          npm run build

  # ── Job 2: Deploy (runs ONLY on push to main) ──────────────────────────────
  # Only triggers after build job passes, only on main branch
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chitfund-frontend/package-lock.json

      - name: Build React frontend
        working-directory: chitfund-frontend
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync backend source to EC2
        run: |
          rsync -az \
            --exclude='.git' \
            --exclude='*/target/' \
            --exclude='node_modules' \
            --exclude='chitfund-frontend' \
            --exclude='chitfund-audit-service' \
            --exclude='chitfund-notification-service' \
            --exclude='chitfund-reporting-service' \
            --exclude='chitfund-member-service' \
            --exclude='restful-web-services' \
            --exclude='MyVibeCodingApp' \
            --exclude='*.pem' \
            -e "ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no" \
            . ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.APP_DIR }}/

      - name: Update .env on EC2
        run: |
          echo "${{ secrets.PROD_ENV }}" | \
            ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no \
              ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
              "cat > ${{ env.APP_DIR }}/.env"

      - name: Build and restart Docker services
        run: |
          ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ${{ env.APP_DIR }} && \
             docker compose -f docker-compose.prod.yml build && \
             docker compose -f docker-compose.prod.yml up -d && \
             docker compose -f docker-compose.prod.yml ps"

      - name: Deploy frontend to nginx
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no" \
            chitfund-frontend/dist/ \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/chitfund-dist-new/

          ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo cp -r /tmp/chitfund-dist-new/. /var/www/chitfund/ && \
             sudo nginx -s reload && \
             echo 'Frontend live'"

      - name: Health check
        run: |
          echo "Waiting 60s for services to stabilize..."
          sleep 60
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.EC2_HOST }}/api/auth/login \
            -X POST -H "Content-Type: application/json" \
            -d '{"username":"invalid","password":"invalid"}')
          echo "Auth endpoint HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "400" ]; then
            echo "Health check PASSED"
          else
            echo "Health check FAILED (got $HTTP_STATUS)"
            exit 1
          fi
