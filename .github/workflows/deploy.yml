name: ChitWise Platform CI/CD

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Force deploy backend'
        type: boolean
        default: false
      deploy_frontend:
        description: 'Force deploy frontend'
        type: boolean
        default: false

env:
  EC2_USER: ec2-user
  APP_DIR: /app
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/saisrinivasgada

jobs:

  # ── 1. Detect what changed ────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      user:         ${{ steps.f.outputs.user         == 'true' || inputs.deploy_backend  == 'true' }}
      member:       ${{ steps.f.outputs.member       == 'true' || inputs.deploy_backend  == 'true' }}
      chit:         ${{ steps.f.outputs.chit         == 'true' || inputs.deploy_backend  == 'true' }}
      payment:      ${{ steps.f.outputs.payment      == 'true' || inputs.deploy_backend  == 'true' }}
      payout:       ${{ steps.f.outputs.payout       == 'true' || inputs.deploy_backend  == 'true' }}
      notification: ${{ steps.f.outputs.notification == 'true' || inputs.deploy_backend  == 'true' }}
      gateway:      ${{ steps.f.outputs.gateway      == 'true' || inputs.deploy_backend  == 'true' }}
      audit:        ${{ steps.f.outputs.audit        == 'true' || inputs.deploy_backend  == 'true' }}
      frontend:     ${{ steps.f.outputs.frontend     == 'true' || inputs.deploy_frontend == 'true' }}
      backend:      ${{ steps.f.outputs.backend      == 'true' || inputs.deploy_backend  == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            user:
              - 'chitfund-common/**'
              - 'chitfund-user-service/**'
            member:
              - 'chitfund-common/**'
              - 'chitfund-member-service/**'
            chit:
              - 'chitfund-common/**'
              - 'chitfund-chit-service/**'
            payment:
              - 'chitfund-common/**'
              - 'chitfund-payment-service/**'
            payout:
              - 'chitfund-common/**'
              - 'chitfund-payout-service/**'
            notification:
              - 'chitfund-common/**'
              - 'chitfund-notification-service/**'
            gateway:
              - 'chitfund-common/**'
              - 'chitfund-api-gateway/**'
            audit:
              - 'chitfund-common/**'
              - 'chitfund-audit-service/**'
            frontend:
              - 'chitfund-frontend/**'
            backend:
              - 'chitfund-common/**'
              - 'chitfund-user-service/**'
              - 'chitfund-member-service/**'
              - 'chitfund-chit-service/**'
              - 'chitfund-notification-service/**'
              - 'chitfund-payment-service/**'
              - 'chitfund-payout-service/**'
              - 'chitfund-api-gateway/**'
              - 'chitfund-audit-service/**'

  # ── 2. Per-service compile checks (run in parallel) ───────────────────────────

  build-user:
    name: "user-service"
    needs: changes
    if: needs.changes.outputs.user == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-user-service -am compile -q --no-transfer-progress

  build-member:
    name: "member-service"
    needs: changes
    if: needs.changes.outputs.member == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-member-service -am compile -q --no-transfer-progress

  build-chit:
    name: "chit-service"
    needs: changes
    if: needs.changes.outputs.chit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-chit-service -am compile -q --no-transfer-progress

  build-payment:
    name: "payment-service"
    needs: changes
    if: needs.changes.outputs.payment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-payment-service -am compile -q --no-transfer-progress

  build-payout:
    name: "payout-service"
    needs: changes
    if: needs.changes.outputs.payout == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-payout-service -am compile -q --no-transfer-progress

  build-notification:
    name: "notification-service"
    needs: changes
    if: needs.changes.outputs.notification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-notification-service -am compile -q --no-transfer-progress

  build-gateway:
    name: "api-gateway"
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-api-gateway -am compile -q --no-transfer-progress

  build-audit:
    name: "audit-service"
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-audit-service -am compile -q --no-transfer-progress

  build-frontend:
    name: "frontend"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chitfund-frontend/package-lock.json
      - name: Build
        working-directory: chitfund-frontend
        run: npm ci && npm run build

  # ── 3. Build summary — satisfies branch protection rule ───────────────────────
  build-summary:
    name: Build & Compile Check
    runs-on: ubuntu-latest
    needs: [build-user, build-member, build-chit, build-payment, build-payout, build-notification, build-gateway, build-audit, build-frontend]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more service builds failed."
            exit 1
          fi
          echo "All builds passed or were skipped (nothing changed)."

  # ── 4. Build Docker images on GitHub runner & push to GHCR ───────────────────
  push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, build-summary]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-summary.result == 'success' &&
      needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api-gateway
        if: needs.changes.outputs.gateway == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-api-gateway/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api-gateway:latest
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=max,scope=api-gateway

      - name: Build & push user-service
        if: needs.changes.outputs.user == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-user-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/user-service:latest
          cache-from: type=gha,scope=user-service
          cache-to: type=gha,mode=max,scope=user-service

      - name: Build & push member-service
        if: needs.changes.outputs.member == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-member-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/member-service:latest
          cache-from: type=gha,scope=member-service
          cache-to: type=gha,mode=max,scope=member-service

      - name: Build & push chit-service
        if: needs.changes.outputs.chit == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-chit-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/chit-service:latest
          cache-from: type=gha,scope=chit-service
          cache-to: type=gha,mode=max,scope=chit-service

      - name: Build & push payment-service
        if: needs.changes.outputs.payment == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-payment-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/payment-service:latest
          cache-from: type=gha,scope=payment-service
          cache-to: type=gha,mode=max,scope=payment-service

      - name: Build & push payout-service
        if: needs.changes.outputs.payout == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-payout-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/payout-service:latest
          cache-from: type=gha,scope=payout-service
          cache-to: type=gha,mode=max,scope=payout-service

      - name: Build & push notification-service
        if: needs.changes.outputs.notification == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-notification-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/notification-service:latest
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,mode=max,scope=notification-service

      - name: Build & push audit-service
        if: needs.changes.outputs.audit == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-audit-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/audit-service:latest
          cache-from: type=gha,scope=audit-service
          cache-to: type=gha,mode=max,scope=audit-service

  # ── 5. Deploy — EC2 pulls images and restarts ─────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-summary, push-images]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-summary.result == 'success' &&
      (needs.push-images.result == 'success' || (needs.push-images.result == 'skipped' && needs.changes.outputs.backend != 'true')) &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.EC2_HOST }}
            ServerAliveInterval 60
            ServerAliveCountMax 30
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      # ── Backend deploy ────────────────────────────────────────────────────────
      - name: Sync docker-compose and update .env
        if: needs.changes.outputs.backend == 'true'
        run: |
          scp -i ~/.ssh/deploy-key.pem \
            docker-compose.prod.yml \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.APP_DIR }}/docker-compose.prod.yml
          echo "${{ secrets.PROD_ENV }}" | \
            ssh -i ~/.ssh/deploy-key.pem \
              ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
              "cat > ${{ env.APP_DIR }}/.env"

      - name: Pull images and restart services
        if: needs.changes.outputs.backend == 'true'
        run: |
          ssh -i ~/.ssh/deploy-key.pem \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
          set -e
          source /app/.env
          # Clear any failed Flyway migrations so services can start cleanly
          for db in chitfund_user chitfund_member chitfund_chit chitfund_payment chitfund_payout chitfund_notification chitfund_audit; do
            mysql -h "$DB_HOST" -u chitfund -p"$DB_PASSWORD" "$db" \
              -e "DELETE FROM flyway_schema_history WHERE success = 0;" 2>/dev/null || true
          done
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd /app
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --wait || {
            echo "=== DEPLOY FAILED — container logs ==="
            docker compose -f docker-compose.prod.yml ps
            exit 1
          }
          docker compose -f docker-compose.prod.yml ps
          docker image prune -f
          ENDSSH

      # ── Frontend deploy ───────────────────────────────────────────────────────
      - name: Setup Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chitfund-frontend/package-lock.json

      - name: Build React frontend
        if: needs.changes.outputs.frontend == 'true'
        working-directory: chitfund-frontend
        run: npm ci && npm run build

      - name: Deploy frontend and nginx config
        if: needs.changes.outputs.frontend == 'true'
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no" \
            chitfund-frontend/dist/ \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/chitfund-dist-new/

          scp -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no \
            nginx.conf \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/chitfund-nginx.conf

          ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo cp -r /tmp/chitfund-dist-new/. /var/www/chitfund/ && \
             sudo cp /tmp/chitfund-nginx.conf /etc/nginx/conf.d/chitfund.conf && \
             sudo nginx -t && sudo nginx -s reload && \
             echo 'Frontend + nginx config deployed'"

      # ── Health check ──────────────────────────────────────────────────────────
      - name: Health check
        run: |
          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            echo "Waiting 60s for backend services to stabilize..."
            sleep 60
          else
            echo "Frontend-only deploy, waiting 5s..."
            sleep 5
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.EC2_HOST }}/api/auth/login \
            -X POST -H "Content-Type: application/json" \
            -d '{"username":"invalid","password":"invalid"}')
          echo "Auth endpoint HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "400" ]; then
            echo "Health check PASSED"
          else
            echo "Health check FAILED (got $HTTP_STATUS)"
            exit 1
          fi
