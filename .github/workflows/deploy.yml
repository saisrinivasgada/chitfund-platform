name: ChitWise Platform CI/CD

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Force deploy backend'
        type: boolean
        default: false
      deploy_frontend:
        description: 'Force deploy frontend'
        type: boolean
        default: false

env:
  EC2_USER: ec2-user
  APP_DIR: /app
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/saisrinivasgada

jobs:

  # ── 1. Detect what changed ────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      user:         ${{ steps.out.outputs.user }}
      member:       ${{ steps.out.outputs.member }}
      chit:         ${{ steps.out.outputs.chit }}
      payment:      ${{ steps.out.outputs.payment }}
      payout:       ${{ steps.out.outputs.payout }}
      notification: ${{ steps.out.outputs.notification }}
      gateway:      ${{ steps.out.outputs.gateway }}
      audit:        ${{ steps.out.outputs.audit }}
      reporting:    ${{ steps.out.outputs.reporting }}
      management:   ${{ steps.out.outputs.management }}
      frontend:     ${{ steps.out.outputs.frontend }}
      backend:      ${{ steps.out.outputs.backend }}
      e2e:          ${{ steps.out.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            user:
              - 'chitfund-common/**'
              - 'chitfund-user-service/**'
            member:
              - 'chitfund-common/**'
              - 'chitfund-member-service/**'
            chit:
              - 'chitfund-common/**'
              - 'chitfund-chit-service/**'
            payment:
              - 'chitfund-common/**'
              - 'chitfund-payment-service/**'
            payout:
              - 'chitfund-common/**'
              - 'chitfund-payout-service/**'
            notification:
              - 'chitfund-common/**'
              - 'chitfund-notification-service/**'
            gateway:
              - 'chitfund-common/**'
              - 'chitfund-api-gateway/**'
            audit:
              - 'chitfund-common/**'
              - 'chitfund-audit-service/**'
            reporting:
              - 'chitfund-common/**'
              - 'chitfund-reporting-service/**'
            management:
              - 'chitwise-management-service/**'
            frontend:
              - 'chitfund-frontend/**'
            backend:
              - 'docker-compose.prod.yml'
              - 'scripts/fetch-secrets.sh'
              - '.github/workflows/deploy.yml'
              - 'chitfund-common/**'
              - 'chitfund-user-service/**'
              - 'chitfund-member-service/**'
              - 'chitfund-chit-service/**'
              - 'chitfund-notification-service/**'
              - 'chitfund-payment-service/**'
              - 'chitfund-payout-service/**'
              - 'chitfund-api-gateway/**'
              - 'chitfund-audit-service/**'
              - 'chitfund-reporting-service/**'
              - 'chitwise-management-service/**'
            e2e:
              - 'chitfund-common/**'
              - 'chitfund-user-service/**'
              - 'chitfund-member-service/**'
              - 'chitfund-chit-service/**'
              - 'chitfund-notification-service/**'
              - 'chitfund-payment-service/**'
              - 'chitfund-payout-service/**'
              - 'chitfund-api-gateway/**'
              - 'chitfund-audit-service/**'
              - 'chitfund-reporting-service/**'
              - 'chitwise-management-service/**'
              - 'docker-compose.test.yml'
              - 'docker-compose.events-test.yml'
              - 'scripts/test-reset.sh'
              - 'scripts/mysql/**'
              - 'scripts/localstack/**'
              - 'tests/**'
              - '.github/workflows/deploy.yml'
      - name: Resolve outputs (paths-filter + force-deploy inputs)
        id: out
        run: |
          force_be="${{ inputs.deploy_backend }}"
          force_fe="${{ inputs.deploy_frontend }}"
          be() { [[ "${{ steps.f.outputs.backend }}"      == "true" || "$force_be" == "true" ]] && echo true || echo false; }
          fe() { [[ "${{ steps.f.outputs.frontend }}"     == "true" || "$force_fe" == "true" ]] && echo true || echo false; }
          {
            echo "user=$(       [[ "${{ steps.f.outputs.user }}"         == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "member=$(     [[ "${{ steps.f.outputs.member }}"       == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "chit=$(       [[ "${{ steps.f.outputs.chit }}"         == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "payment=$(    [[ "${{ steps.f.outputs.payment }}"      == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "payout=$(     [[ "${{ steps.f.outputs.payout }}"      == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "notification=$([[ "${{ steps.f.outputs.notification }}" == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "gateway=$(    [[ "${{ steps.f.outputs.gateway }}"      == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "audit=$(      [[ "${{ steps.f.outputs.audit }}"        == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "reporting=$(  [[ "${{ steps.f.outputs.reporting }}"    == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "management=$( [[ "${{ steps.f.outputs.management }}"   == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "frontend=$(   fe )"
            echo "backend=$(    be )"
            echo "e2e=$(        [[ "${{ steps.f.outputs.e2e }}" == "true" || "$force_be" == "true" ]] && echo true || echo false )"
          } >> "$GITHUB_OUTPUT"

  # ── 2. Per-service compile + unit tests (run in parallel) ────────────────────
  # These ran `compile` until 2026-09-10, which never touched src/test. The only
  # settlement tests in the repo had been failing unnoticed for months as a
  # result. Running `test` here means a broken test now blocks the deploy.

  build-user:
    name: "user-service"
    needs: changes
    if: needs.changes.outputs.user == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-user-service -am test --no-transfer-progress

  build-member:
    name: "member-service"
    needs: changes
    if: needs.changes.outputs.member == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-member-service -am test --no-transfer-progress

  build-chit:
    name: "chit-service"
    needs: changes
    if: needs.changes.outputs.chit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-chit-service -am test --no-transfer-progress

  build-payment:
    name: "payment-service"
    needs: changes
    if: needs.changes.outputs.payment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-payment-service -am test --no-transfer-progress

  build-payout:
    name: "payout-service"
    needs: changes
    if: needs.changes.outputs.payout == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-payout-service -am test --no-transfer-progress

  build-notification:
    name: "notification-service"
    needs: changes
    if: needs.changes.outputs.notification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-notification-service -am test --no-transfer-progress

  build-gateway:
    name: "api-gateway"
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-api-gateway -am test --no-transfer-progress

  build-audit:
    name: "audit-service"
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-audit-service -am test --no-transfer-progress

  build-reporting:
    name: "reporting-service"
    needs: changes
    if: needs.changes.outputs.reporting == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-reporting-service -am test --no-transfer-progress

  build-management:
    name: "management-service"
    needs: changes
    if: needs.changes.outputs.management == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitwise-management-service test --no-transfer-progress

  build-frontend:
    name: "frontend"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chitfund-frontend/package-lock.json
      - name: Build
        working-directory: chitfund-frontend
        run: npm ci && npm run build

  # ── 3. Build summary — satisfies branch protection rule ───────────────────────
  build-summary:
    name: Build & Compile Check
    runs-on: ubuntu-latest
    needs: [build-user, build-member, build-chit, build-payment, build-payout, build-notification, build-gateway, build-audit, build-reporting, build-management, build-frontend]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable Flyway migrations
        run: ./scripts/check-migration-safety.sh
      - name: Validate production configuration
        env:
          JWT_SECRET: ci-jwt-secret-that-is-long-enough-for-validation
          INTERNAL_SERVICE_KEY: ci-internal-service-key-for-compose-validation
          DB_HOST: mysql.example.invalid
          DB_PASSWORD: ci-database-password
          MANAGEMENT_JWT_SECRET: ci-management-jwt-secret-long-enough
          MAIL_USERNAME: ci@example.invalid
          MAIL_PASSWORD: ci-mail-password
        run: |
          python3 scripts/check-production-config.py
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more service builds failed."
            exit 1
          fi
          echo "All builds passed or were skipped (nothing changed)."

  # ── 4. Disposable MySQL/SQS financial integration tests ────────────────────
  financial-e2e:
    name: Financial integration (MySQL 8 + SQS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, build-summary]
    if: |
      always() &&
      needs.build-summary.result == 'success' &&
      needs.changes.outputs.e2e == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: pip install --requirement tests/requirements.txt
      - name: Start disposable financial stack
        run: docker compose -f docker-compose.test.yml up -d --build --wait --wait-timeout 300
      - name: Run service-integration and oracle suite
        run: python -m pytest -c tests/pytest.ini tests
      - name: Recreate stack with disposable LocalStack SQS
        run: |
          docker compose -f docker-compose.test.yml down --volumes --remove-orphans
          docker compose -f docker-compose.test.yml -f docker-compose.events-test.yml \
            up -d --build --wait --wait-timeout 300
      - name: Verify dual delivery and inbox deduplication
        env:
          TEST_EVENT_STACK: "true"
        run: python -m pytest -c tests/pytest.ini tests/e2e/test_event_delivery.py
      - name: Print container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.events-test.yml ps
          docker compose -f docker-compose.test.yml -f docker-compose.events-test.yml \
            logs --no-color --tail=300
      - name: Tear down disposable stack
        if: always()
        run: docker compose -f docker-compose.test.yml -f docker-compose.events-test.yml down --volumes --remove-orphans

  # ── 5. Build Docker images on GitHub runner & push to GHCR ───────────────────
  push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, build-summary, financial-e2e]
    # always() so the gating below is the only thing that decides. Without a
    # status function GitHub applies an implicit success() plus its own
    # skip-propagation, and this job skipped on every push while running on
    # every workflow_dispatch — even when change detection had correctly
    # resolved backend=true. Every real condition is still checked explicitly,
    # so a failed build-summary still stops the build.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-summary.result == 'success' &&
      (needs.financial-e2e.result == 'success' ||
       (needs.financial-e2e.result == 'skipped' && needs.changes.outputs.e2e != 'true')) &&
      needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Why this job ran
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }}"
          echo "build-summary=${{ needs.build-summary.result }}"
          echo "backend=${{ needs.changes.outputs.backend }} frontend=${{ needs.changes.outputs.frontend }}"

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api-gateway
        if: needs.changes.outputs.gateway == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-api-gateway/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api-gateway:latest
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=max,scope=api-gateway

      - name: Build & push user-service
        if: needs.changes.outputs.user == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-user-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/user-service:latest
          cache-from: type=gha,scope=user-service
          cache-to: type=gha,mode=max,scope=user-service

      - name: Build & push member-service
        if: needs.changes.outputs.member == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-member-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/member-service:latest
          cache-from: type=gha,scope=member-service
          cache-to: type=gha,mode=max,scope=member-service

      - name: Build & push chit-service
        if: needs.changes.outputs.chit == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-chit-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/chit-service:latest
          cache-from: type=gha,scope=chit-service
          cache-to: type=gha,mode=max,scope=chit-service

      - name: Build & push payment-service
        if: needs.changes.outputs.payment == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-payment-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/payment-service:latest
          cache-from: type=gha,scope=payment-service
          cache-to: type=gha,mode=max,scope=payment-service

      - name: Build & push payout-service
        if: needs.changes.outputs.payout == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-payout-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/payout-service:latest
          cache-from: type=gha,scope=payout-service
          cache-to: type=gha,mode=max,scope=payout-service

      - name: Build & push notification-service
        if: needs.changes.outputs.notification == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-notification-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/notification-service:latest
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,mode=max,scope=notification-service

      - name: Build & push audit-service
        if: needs.changes.outputs.audit == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-audit-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/audit-service:latest
          cache-from: type=gha,scope=audit-service
          cache-to: type=gha,mode=max,scope=audit-service

      - name: Build & push reporting-service
        if: needs.changes.outputs.reporting == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-reporting-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/reporting-service:latest
          cache-from: type=gha,scope=reporting-service
          cache-to: type=gha,mode=max,scope=reporting-service

      - name: Build & push management-service
        if: needs.changes.outputs.management == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitwise-management-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/management-service:latest
          cache-from: type=gha,scope=management-service
          cache-to: type=gha,mode=max,scope=management-service

  # ── 5. Deploy — EC2 pulls images and restarts ─────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, build-summary, push-images]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-summary.result == 'success' &&
      (needs.push-images.result == 'success' || (needs.push-images.result == 'skipped' && needs.changes.outputs.backend != 'true')) &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.EC2_HOST }}
            ServerAliveInterval 60
            ServerAliveCountMax 30
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      # ── Backend deploy ────────────────────────────────────────────────────────
      - name: Sync docker-compose and fetch secrets
        if: needs.changes.outputs.backend == 'true'
        run: |
          scp -i ~/.ssh/deploy-key.pem \
            docker-compose.prod.yml \
            scripts/fetch-secrets.sh \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.APP_DIR }}/
          ssh -i ~/.ssh/deploy-key.pem \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "chmod +x ${{ env.APP_DIR }}/fetch-secrets.sh && ${{ env.APP_DIR }}/fetch-secrets.sh"

      - name: Pull images and restart services
        if: needs.changes.outputs.backend == 'true'
        run: |
          ssh -i ~/.ssh/deploy-key.pem \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
          set -e
          # Read just the two values needed below. Sourcing the whole file made
          # bash interpret every secret, so one value containing a space, '#' or
          # a quote failed the deploy before it started.
          getsecret() { sed -n "s/^$1=//p" /app/.env | head -1 | sed -e "s/^['\"]//" -e "s/['\"]$//"; }
          DB_HOST=$(getsecret DB_HOST)
          DB_PASSWORD=$(getsecret DB_PASSWORD)
          DBS="chitfund_user chitfund_member chitfund_chit chitfund_payment chitfund_payout chitfund_notification chitfund_audit chitfund_reporting chitwise_management"
          # Each service owns a schema and Flyway builds its tables, but nothing
          # created the schema itself — so a newly added service starts against a
          # database that does not exist and never turns healthy. That is how
          # chitwise_management failed. Doing it here keeps the deploy
          # reproducible if the environment is ever rebuilt.
          for db in $DBS; do
            if ! mysql -h "$DB_HOST" -u chitfund -p"$DB_PASSWORD" \
                 -e "CREATE DATABASE IF NOT EXISTS $db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"; then
              echo "WARN: could not ensure database '$db' exists — check the chitfund user's CREATE privilege"
            fi
          done
          # Pre-flight: report failed migrations, never erase them.
          #
          # This used to run DELETE FROM flyway_schema_history WHERE success = 0,
          # which let a deploy "succeed" by destroying the evidence that a
          # migration had failed. A failed migration usually means a partially
          # applied schema change; deleting the row makes Flyway retry it against
          # a database that is already half-migrated, and the second failure has
          # no record of the first. On financial schemas that is how silent
          # divergence starts.
          #
          # Now it stops and hands the decision to a human, who can inspect the
          # partial state and either finish it or write a forward correction.
          FAILED=0
          for db in $DBS; do
            rows=$(mysql -N -B -h "$DB_HOST" -u chitfund -p"$DB_PASSWORD" "$db" \
              -e "SELECT CONCAT(version,' ',description,' (attempted ',installed_on,')')
                  FROM flyway_schema_history WHERE success = 0;" 2>/dev/null || true)
            if [ -n "$rows" ]; then
              FAILED=1
              echo "=== FAILED MIGRATIONS in $db ==="
              echo "$rows"
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "Deploy aborted: the schema above is partially migrated."
            echo "Inspect it before doing anything. Do NOT delete the history row —"
            echo "that hides the partial change rather than undoing it. Either finish"
            echo "the migration by hand and mark the row successful, or add a forward"
            echo "corrective migration and redeploy."
            exit 1
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd /app
          docker compose -f docker-compose.prod.yml pull
          # Cold starts on the small EC2 host regularly take 2-3 minutes while
          # all Java services initialise together. Match Compose's overall wait
          # to the 4-minute health-check grace period with additional headroom.
          docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 600 || {
            echo "=== DEPLOY FAILED ==="
            docker compose -f docker-compose.prod.yml ps
            # Print logs for whatever is not running or not healthy. The handler
            # promised logs but only ever printed 'ps', so failures had to be
            # diagnosed by guesswork.
            for c in $(docker ps -a --format '{{.Names}} {{.Status}}' \
                       | grep -Ev 'Up .*\(healthy\)' | awk '{print $1}'); do
              echo "--- logs: $c ---"
              docker logs --tail 60 "$c" 2>&1 | tail -40
            done
            exit 1
          }
          docker compose -f docker-compose.prod.yml ps
          docker image prune -f
          ENDSSH

      # ── Frontend deploy ───────────────────────────────────────────────────────
      - name: Setup Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chitfund-frontend/package-lock.json

      - name: Build React frontend
        if: needs.changes.outputs.frontend == 'true'
        working-directory: chitfund-frontend
        run: npm ci && npm run build

      - name: Deploy frontend and nginx config
        if: needs.changes.outputs.frontend == 'true'
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no" \
            chitfund-frontend/dist/ \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/chitfund-dist-new/

          scp -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no \
            nginx.conf \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/chitfund-nginx.conf

          ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo cp -r /tmp/chitfund-dist-new/. /var/www/chitfund/ && \
             sudo cp /tmp/chitfund-nginx.conf /etc/nginx/conf.d/chitfund.conf && \
             sudo nginx -t && sudo nginx -s reload && \
             echo 'Frontend + nginx config deployed'"

      # ── Health check ──────────────────────────────────────────────────────────
      - name: Health check
        run: |
          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            echo "Waiting 60s for backend services to stabilize..."
            sleep 60
          else
            echo "Frontend-only deploy, waiting 5s..."
            sleep 5
          fi
          HTTP_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" \
            https://${{ secrets.EC2_HOST }}/api/auth/login \
            -H "Host: api.thechitwise.com" \
            -X POST -H "Content-Type: application/json" \
            -d '{"username":"invalid","password":"invalid"}')
          echo "Auth endpoint HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "400" ]; then
            echo "Health check PASSED"
          else
            echo "Health check FAILED (got $HTTP_STATUS)"
            exit 1
          fi
