name: ChitWise Platform CI/CD

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Force deploy backend'
        type: boolean
        default: false
      deploy_frontend:
        description: 'Force deploy frontend'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/saisrinivasgada

jobs:

  # ── 1. Detect what changed ────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      user:         ${{ steps.out.outputs.user }}
      member:       ${{ steps.out.outputs.member }}
      chit:         ${{ steps.out.outputs.chit }}
      payment:      ${{ steps.out.outputs.payment }}
      payout:       ${{ steps.out.outputs.payout }}
      notification: ${{ steps.out.outputs.notification }}
      gateway:      ${{ steps.out.outputs.gateway }}
      audit:        ${{ steps.out.outputs.audit }}
      reporting:    ${{ steps.out.outputs.reporting }}
      management:   ${{ steps.out.outputs.management }}
      frontend:     ${{ steps.out.outputs.frontend }}
      backend:      ${{ steps.out.outputs.backend }}
      e2e:          ${{ steps.out.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - name: Offline deployment configuration checks
        run: python3 scripts/test-offline-config.py
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            user:
              - 'chitfund-common/**'
              - 'chitfund-user-service/**'
            member:
              - 'chitfund-common/**'
              - 'chitfund-member-service/**'
            chit:
              - 'chitfund-common/**'
              - 'chitfund-chit-service/**'
            payment:
              - 'chitfund-common/**'
              - 'chitfund-payment-service/**'
            payout:
              - 'chitfund-common/**'
              - 'chitfund-payout-service/**'
            notification:
              - 'chitfund-common/**'
              - 'chitfund-notification-service/**'
            gateway:
              - 'chitfund-common/**'
              - 'chitfund-api-gateway/**'
            audit:
              - 'chitfund-common/**'
              - 'chitfund-audit-service/**'
            reporting:
              - 'chitfund-common/**'
              - 'chitfund-reporting-service/**'
            management:
              - 'chitwise-management-service/**'
            frontend:
              - 'shared/offline/**'
              - 'chitfund-frontend/**'
              - 'nginx.conf'
            backend:
              - 'docker-compose.prod.yml'
              - 'scripts/fetch-secrets.sh'
              - 'scripts/prepare-offline-config.py'
              - 'scripts/test-offline-config.py'
              - 'scripts/deploy-mumbai.sh'
              - '.github/workflows/deploy.yml'
              - 'chitfund-common/**'
              - 'chitfund-user-service/**'
              - 'chitfund-member-service/**'
              - 'chitfund-chit-service/**'
              - 'chitfund-notification-service/**'
              - 'chitfund-payment-service/**'
              - 'chitfund-payout-service/**'
              - 'chitfund-api-gateway/**'
              - 'chitfund-audit-service/**'
              - 'chitfund-reporting-service/**'
              - 'chitwise-management-service/**'
            e2e:
              - 'chitfund-common/**'
              - 'chitfund-user-service/**'
              - 'chitfund-member-service/**'
              - 'chitfund-chit-service/**'
              - 'chitfund-notification-service/**'
              - 'chitfund-payment-service/**'
              - 'chitfund-payout-service/**'
              - 'chitfund-api-gateway/**'
              - 'chitfund-audit-service/**'
              - 'chitfund-reporting-service/**'
              - 'chitwise-management-service/**'
              - 'docker-compose.test.yml'
              - 'docker-compose.events-test.yml'
              - 'scripts/test-reset.sh'
              - 'scripts/mysql/**'
              - 'scripts/localstack/**'
              - 'tests/**'
              - '.github/workflows/deploy.yml'
      - name: Resolve outputs (paths-filter + force-deploy inputs)
        id: out
        run: |
          force_be="${{ inputs.deploy_backend }}"
          force_fe="${{ inputs.deploy_frontend }}"
          be() { [[ "${{ steps.f.outputs.backend }}"      == "true" || "$force_be" == "true" ]] && echo true || echo false; }
          fe() { [[ "${{ steps.f.outputs.frontend }}"     == "true" || "$force_fe" == "true" ]] && echo true || echo false; }
          {
            echo "user=$(       [[ "${{ steps.f.outputs.user }}"         == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "member=$(     [[ "${{ steps.f.outputs.member }}"       == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "chit=$(       [[ "${{ steps.f.outputs.chit }}"         == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "payment=$(    [[ "${{ steps.f.outputs.payment }}"      == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "payout=$(     [[ "${{ steps.f.outputs.payout }}"      == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "notification=$([[ "${{ steps.f.outputs.notification }}" == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "gateway=$(    [[ "${{ steps.f.outputs.gateway }}"      == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "audit=$(      [[ "${{ steps.f.outputs.audit }}"        == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "reporting=$(  [[ "${{ steps.f.outputs.reporting }}"    == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "management=$( [[ "${{ steps.f.outputs.management }}"   == "true" || "$force_be" == "true" ]] && echo true || echo false )"
            echo "frontend=$(   fe )"
            echo "backend=$(    be )"
            echo "e2e=$(        [[ "${{ steps.f.outputs.e2e }}" == "true" || "$force_be" == "true" ]] && echo true || echo false )"
          } >> "$GITHUB_OUTPUT"

  # ── 2. Per-service compile + unit tests (run in parallel) ────────────────────
  # These ran `compile` until 2026-09-10, which never touched src/test. The only
  # settlement tests in the repo had been failing unnoticed for months as a
  # result. Running `test` here means a broken test now blocks the deploy.

  build-user:
    name: "user-service"
    needs: changes
    if: needs.changes.outputs.user == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-user-service -am test --no-transfer-progress

  build-member:
    name: "member-service"
    needs: changes
    if: needs.changes.outputs.member == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-member-service -am test --no-transfer-progress

  build-chit:
    name: "chit-service"
    needs: changes
    if: needs.changes.outputs.chit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-chit-service -am test --no-transfer-progress

  build-payment:
    name: "payment-service"
    needs: changes
    if: needs.changes.outputs.payment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-payment-service -am test --no-transfer-progress

  build-payout:
    name: "payout-service"
    needs: changes
    if: needs.changes.outputs.payout == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-payout-service -am test --no-transfer-progress

  build-notification:
    name: "notification-service"
    needs: changes
    if: needs.changes.outputs.notification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-notification-service -am test --no-transfer-progress

  build-gateway:
    name: "api-gateway"
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-api-gateway -am test --no-transfer-progress

  build-audit:
    name: "audit-service"
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-audit-service -am test --no-transfer-progress

  build-reporting:
    name: "reporting-service"
    needs: changes
    if: needs.changes.outputs.reporting == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitfund-reporting-service -am test --no-transfer-progress

  build-management:
    name: "management-service"
    needs: changes
    if: needs.changes.outputs.management == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile & test
        run: mvn -pl chitfund-common,chitwise-management-service -am test --no-transfer-progress
      - name: Require the MySQL 8 employee migration test to run
        run: |
          report="chitwise-management-service/target/surefire-reports/TEST-com.chitfund.supportservice.migration.EmployeePasswordMigrationMySqlTest.xml"
          test -f "$report"
          python3 - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse(sys.argv[1]).getroot()
          counts = {name: int(suite.attrib.get(name, "0"))
                    for name in ("tests", "failures", "errors", "skipped")}
          if (counts["tests"] < 1 or any(counts[name] for name in ("failures", "errors", "skipped"))):
              raise SystemExit(f"MySQL migration test guard failed: {counts}")
          print(f"MySQL migration test guard passed: {counts}")
          PY

  build-frontend:
    name: "frontend"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chitfund-frontend/package-lock.json
      - name: Install dependencies
        working-directory: chitfund-frontend
        run: npm ci
      - name: Install browser test runtime
        working-directory: chitfund-frontend
        run: npx playwright install --with-deps chromium
      - name: Shared offline policy and snapshot checks
        run: node --test shared/offline/*.test.mjs
      - name: Production offline shell and background delivery
        working-directory: chitfund-frontend
        run: npm run test:offline
      - name: Rendered browser assertions
        working-directory: chitfund-frontend
        run: npm run test:browser
      - name: Build
        working-directory: chitfund-frontend
        run: npm run build

  # ── 3. Build summary — satisfies branch protection rule ───────────────────────
  build-summary:
    name: Build & Compile Check
    runs-on: ubuntu-latest
    needs: [build-user, build-member, build-chit, build-payment, build-payout, build-notification, build-gateway, build-audit, build-reporting, build-management, build-frontend]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable Flyway migrations
        run: ./scripts/check-migration-safety.sh
      - name: Validate production configuration
        env:
          JWT_SECRET: ci-jwt-secret-that-is-long-enough-for-validation
          INTERNAL_SERVICE_KEY: ci-internal-service-key-for-compose-validation
          DB_HOST: mysql.example.invalid
          DB_PASSWORD: ci-database-password
          MANAGEMENT_JWT_SECRET: ci-management-jwt-secret-long-enough
          MAIL_USERNAME: ci@example.invalid
          MAIL_PASSWORD: ci-mail-password
        run: |
          python3 scripts/check-production-config.py
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more service builds failed."
            exit 1
          fi
          echo "All builds passed or were skipped (nothing changed)."

  # ── 4. Disposable MySQL/SQS financial integration tests ────────────────────
  financial-e2e:
    name: Financial integration (MySQL 8 + SQS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, build-summary]
    if: |
      always() &&
      needs.build-summary.result == 'success' &&
      needs.changes.outputs.e2e == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chitfund-frontend/package-lock.json
      - name: Install test dependencies
        run: pip install --requirement tests/requirements.txt
      - name: Install gateway-browser test runtime
        working-directory: chitfund-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start disposable financial stack
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.identity-test.yml \
            up -d --build --wait --wait-timeout 300
      - name: Run rendered gateway member journey
        working-directory: chitfund-frontend
        run: npm run test:browser:gateway
      - name: Run service-integration and oracle suite
        run: python -m pytest -c tests/pytest.ini tests
      - name: Recreate stack with disposable LocalStack SQS
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.identity-test.yml \
            down --volumes --remove-orphans
          docker compose -f docker-compose.test.yml -f docker-compose.events-test.yml \
            up -d --build --wait --wait-timeout 300
      - name: Verify dual delivery and inbox deduplication
        env:
          TEST_EVENT_STACK: "true"
        run: python -m pytest -c tests/pytest.ini tests/e2e/test_event_delivery.py
      - name: Print container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.identity-test.yml \
            -f docker-compose.events-test.yml ps
          echo "=== notification-service (full) ==="
          docker logs chitwise-test-notification 2>&1 || true
          echo "=== reporting-service (full) ==="
          docker logs chitwise-test-reporting 2>&1 || true
          echo "=== audit-service (full) ==="
          docker logs chitwise-test-audit 2>&1 || true
          echo "=== all services (tail 200) ==="
          docker compose -f docker-compose.test.yml -f docker-compose.identity-test.yml \
            -f docker-compose.events-test.yml \
            logs --no-color --tail=200
      - name: Tear down disposable stack
        if: always()
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.identity-test.yml \
            -f docker-compose.events-test.yml down --volumes --remove-orphans

  # ── 5. Build Docker images on GitHub runner & push to GHCR ───────────────────
  push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, build-summary, financial-e2e]
    # always() so the gating below is the only thing that decides. Without a
    # status function GitHub applies an implicit success() plus its own
    # skip-propagation, and this job skipped on every push while running on
    # every workflow_dispatch — even when change detection had correctly
    # resolved backend=true. Every real condition is still checked explicitly,
    # so a failed build-summary still stops the build.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-summary.result == 'success' &&
      (needs.financial-e2e.result == 'success' ||
       (needs.financial-e2e.result == 'skipped' && needs.changes.outputs.e2e != 'true')) &&
      needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Why this job ran
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }}"
          echo "build-summary=${{ needs.build-summary.result }}"
          echo "backend=${{ needs.changes.outputs.backend }} frontend=${{ needs.changes.outputs.frontend }}"

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api-gateway
        if: needs.changes.outputs.gateway == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-api-gateway/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api-gateway:latest
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=max,scope=api-gateway

      - name: Build & push user-service
        if: needs.changes.outputs.user == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-user-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/user-service:latest
          cache-from: type=gha,scope=user-service
          cache-to: type=gha,mode=max,scope=user-service

      - name: Build & push member-service
        if: needs.changes.outputs.member == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-member-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/member-service:latest
          cache-from: type=gha,scope=member-service
          cache-to: type=gha,mode=max,scope=member-service

      - name: Build & push chit-service
        if: needs.changes.outputs.chit == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-chit-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/chit-service:latest
          cache-from: type=gha,scope=chit-service
          cache-to: type=gha,mode=max,scope=chit-service

      - name: Build & push payment-service
        if: needs.changes.outputs.payment == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-payment-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/payment-service:latest
          cache-from: type=gha,scope=payment-service
          cache-to: type=gha,mode=max,scope=payment-service

      - name: Build & push payout-service
        if: needs.changes.outputs.payout == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-payout-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/payout-service:latest
          cache-from: type=gha,scope=payout-service
          cache-to: type=gha,mode=max,scope=payout-service

      - name: Build & push notification-service
        if: needs.changes.outputs.notification == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-notification-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/notification-service:latest
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,mode=max,scope=notification-service

      - name: Build & push audit-service
        if: needs.changes.outputs.audit == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-audit-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/audit-service:latest
          cache-from: type=gha,scope=audit-service
          cache-to: type=gha,mode=max,scope=audit-service

      - name: Build & push reporting-service
        if: needs.changes.outputs.reporting == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitfund-reporting-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/reporting-service:latest
          cache-from: type=gha,scope=reporting-service
          cache-to: type=gha,mode=max,scope=reporting-service

      - name: Build & push management-service
        if: needs.changes.outputs.management == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: chitwise-management-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/management-service:latest
          cache-from: type=gha,scope=management-service
          cache-to: type=gha,mode=max,scope=management-service

  # ── 5. Deploy — EC2 pulls images and restarts ─────────────────────────────────
  deploy:
    name: Deploy to Mumbai
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [changes, build-summary, push-images]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-summary.result == 'success' &&
      (needs.push-images.result == 'success' || (needs.push-images.result == 'skipped' && needs.changes.outputs.backend != 'true')) &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure short-lived Mumbai AWS access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      # ── Frontend deploy ───────────────────────────────────────────────────────
      - name: Setup Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chitfund-frontend/package-lock.json

      - name: Build React frontend
        if: needs.changes.outputs.frontend == 'true'
        working-directory: chitfund-frontend
        run: npm ci && npm run build

      - name: Prepare encrypted deployment bundle
        run: |
          install -d release
          install -m 0644 docker-compose.prod.yml release/docker-compose.prod.yml
          install -m 0755 scripts/fetch-secrets.sh release/fetch-secrets.sh
          install -m 0755 scripts/prepare-offline-config.py release/prepare-offline-config.py
          install -m 0755 scripts/deploy-mumbai.sh release/deploy-mumbai.sh
          install -m 0644 nginx.conf release/nginx.conf
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            cp -a chitfund-frontend/dist release/frontend
          fi
          tar -C release -czf "chitwise-${GITHUB_SHA}.tar.gz" .
          aws s3 cp "chitwise-${GITHUB_SHA}.tar.gz" \
            "s3://${{ vars.AWS_DEPLOY_BUCKET }}/releases/${GITHUB_SHA}.tar.gz" \
            --sse AES256 --only-show-errors

      - name: Deploy through AWS Systems Manager
        env:
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend }}
          DEPLOY_FRONTEND: ${{ needs.changes.outputs.frontend }}
        run: |
          commands=$(jq -nc \
            --arg bucket "${{ vars.AWS_DEPLOY_BUCKET }}" \
            --arg sha "$GITHUB_SHA" \
            --arg backend "$DEPLOY_BACKEND" \
            --arg frontend "$DEPLOY_FRONTEND" \
            '[
              "set -euo pipefail",
              "release_dir=/tmp/chitwise-release-\($sha)",
              "install -d -m 0700 $release_dir",
              "aws s3 cp s3://\($bucket)/releases/\($sha).tar.gz $release_dir/release.tar.gz --region ap-south-1 --only-show-errors",
              "tar -C $release_dir -xzf $release_dir/release.tar.gz",
              "DEPLOY_BACKEND=\($backend) DEPLOY_FRONTEND=\($frontend) RELEASE_DIR=$release_dir bash $release_dir/deploy-mumbai.sh"
            ]')
          parameters=$(jq -nc --argjson commands "$commands" \
            '{commands:$commands,executionTimeout:["1800"]}')
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 120 \
            --comment "Deploy ChitWise ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)

          for attempt in $(seq 1 180); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
                  --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
                  --query '{Output:StandardOutputContent,Error:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Deployment did not finish within 30 minutes" >&2
          exit 1
