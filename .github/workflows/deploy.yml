name: ChitWise Platform CI/CD

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Force deploy backend'
        type: boolean
        default: false
      deploy_frontend:
        description: 'Force deploy frontend'
        type: boolean
        default: false

env:
  EC2_USER: ec2-user
  APP_DIR: /app

jobs:

  # ── 1. Detect what changed ────────────────────────────────────────────────────
  # Each service filter includes chitfund-common so that a shared-lib change
  # triggers all downstream service builds automatically.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      user:         ${{ steps.f.outputs.user         == 'true' || inputs.deploy_backend  == 'true' }}
      member:       ${{ steps.f.outputs.member       == 'true' || inputs.deploy_backend  == 'true' }}
      chit:         ${{ steps.f.outputs.chit         == 'true' || inputs.deploy_backend  == 'true' }}
      payment:      ${{ steps.f.outputs.payment      == 'true' || inputs.deploy_backend  == 'true' }}
      payout:       ${{ steps.f.outputs.payout       == 'true' || inputs.deploy_backend  == 'true' }}
      notification: ${{ steps.f.outputs.notification == 'true' || inputs.deploy_backend  == 'true' }}
      gateway:      ${{ steps.f.outputs.gateway      == 'true' || inputs.deploy_backend  == 'true' }}
      frontend:     ${{ steps.f.outputs.frontend     == 'true' || inputs.deploy_frontend == 'true' }}
      backend:      ${{ steps.f.outputs.backend      == 'true' || inputs.deploy_backend  == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            user:
              - 'chitfund-common/**'
              - 'chitfund-user-service/**'
            member:
              - 'chitfund-common/**'
              - 'chitfund-member-service/**'
            chit:
              - 'chitfund-common/**'
              - 'chitfund-chit-service/**'
            payment:
              - 'chitfund-common/**'
              - 'chitfund-payment-service/**'
            payout:
              - 'chitfund-common/**'
              - 'chitfund-payout-service/**'
            notification:
              - 'chitfund-common/**'
              - 'chitfund-notification-service/**'
            gateway:
              - 'chitfund-common/**'
              - 'chitfund-api-gateway/**'
            frontend:
              - 'chitfund-frontend/**'
            backend:
              - 'chitfund-common/**'
              - 'chitfund-user-service/**'
              - 'chitfund-member-service/**'
              - 'chitfund-chit-service/**'
              - 'chitfund-notification-service/**'
              - 'chitfund-payment-service/**'
              - 'chitfund-payout-service/**'
              - 'chitfund-api-gateway/**'

  # ── 2. Per-service compile checks (run in parallel) ───────────────────────────
  # Each job only runs when its files (or common) changed.
  # They all run at the same time — no waiting for each other.

  build-user:
    name: "user-service"
    needs: changes
    if: needs.changes.outputs.user == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-user-service -am compile -q --no-transfer-progress

  build-member:
    name: "member-service"
    needs: changes
    if: needs.changes.outputs.member == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-member-service -am compile -q --no-transfer-progress

  build-chit:
    name: "chit-service"
    needs: changes
    if: needs.changes.outputs.chit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-chit-service -am compile -q --no-transfer-progress

  build-payment:
    name: "payment-service"
    needs: changes
    if: needs.changes.outputs.payment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-payment-service -am compile -q --no-transfer-progress

  build-payout:
    name: "payout-service"
    needs: changes
    if: needs.changes.outputs.payout == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-payout-service -am compile -q --no-transfer-progress

  build-notification:
    name: "notification-service"
    needs: changes
    if: needs.changes.outputs.notification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-notification-service -am compile -q --no-transfer-progress

  build-gateway:
    name: "api-gateway"
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: mvn -pl chitfund-common,chitfund-api-gateway -am compile -q --no-transfer-progress

  build-frontend:
    name: "frontend"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chitfund-frontend/package-lock.json
      - name: Build
        working-directory: chitfund-frontend
        run: npm ci && npm run build

  # ── 3. Build summary — satisfies branch protection rule ───────────────────────
  # Always runs. Fails if any build job failed; passes if all passed or were skipped.
  # Branch protection targets this job name: "Build & Compile Check"
  build-summary:
    name: Build & Compile Check
    runs-on: ubuntu-latest
    needs: [build-user, build-member, build-chit, build-payment, build-payout, build-notification, build-gateway, build-frontend]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more service builds failed."
            exit 1
          fi
          echo "All builds passed or were skipped (nothing changed)."

  # ── 4. Deploy — only on main push, only what changed ─────────────────────────
  # Skips entirely if no relevant files changed.
  # Backend and frontend deploy steps are gated independently.
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, build-user, build-member, build-chit, build-payment, build-payout, build-notification, build-gateway, build-frontend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.EC2_HOST }}
            ServerAliveInterval 60
            ServerAliveCountMax 30
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      # ── Backend deploy (only if backend changed) ─────────────────────────────
      - name: Sync backend source to EC2
        if: needs.changes.outputs.backend == 'true'
        run: |
          rsync -az \
            --exclude='.git' \
            --exclude='*/target/' \
            --exclude='node_modules' \
            --exclude='chitfund-frontend' \
            --exclude='chitfund-audit-service' \
            --exclude='chitfund-reporting-service' \
            --exclude='restful-web-services' \
            --exclude='MyVibeCodingApp' \
            --exclude='*.pem' \
            -e "ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no" \
            . ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.APP_DIR }}/

      - name: Update .env on EC2
        if: needs.changes.outputs.backend == 'true'
        run: |
          echo "${{ secrets.PROD_ENV }}" | \
            ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no \
              ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
              "cat > ${{ env.APP_DIR }}/.env"

      - name: Build and restart Docker services
        if: needs.changes.outputs.backend == 'true'
        run: |
          ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
          set -e
          cd /app
          echo "=== Building (no cache) ==="
          docker compose -f docker-compose.prod.yml build --no-cache
          echo "=== Starting services ==="
          docker compose -f docker-compose.prod.yml up -d --wait || {
            echo ""
            echo "=== DEPLOY FAILED — container logs ==="
            echo "--- payment-service ---"
            docker logs chitfund-payment-service --tail 120 2>&1 || true
            echo "--- chit-service ---"
            docker logs chitfund-chit-service --tail 30 2>&1 || true
            echo "--- compose ps ---"
            docker compose -f docker-compose.prod.yml ps
            exit 1
          }
          docker compose -f docker-compose.prod.yml ps
          ENDSSH

      # ── Frontend deploy (only if frontend changed) ────────────────────────────
      - name: Setup Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chitfund-frontend/package-lock.json

      - name: Build React frontend
        if: needs.changes.outputs.frontend == 'true'
        working-directory: chitfund-frontend
        run: npm ci && npm run build

      - name: Deploy frontend and nginx config
        if: needs.changes.outputs.frontend == 'true'
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no" \
            chitfund-frontend/dist/ \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/chitfund-dist-new/

          scp -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no \
            nginx.conf \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/chitfund-nginx.conf

          ssh -i ~/.ssh/deploy-key.pem -o StrictHostKeyChecking=no \
            ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo cp -r /tmp/chitfund-dist-new/. /var/www/chitfund/ && \
             sudo cp /tmp/chitfund-nginx.conf /etc/nginx/conf.d/chitfund.conf && \
             sudo nginx -t && sudo nginx -s reload && \
             echo 'Frontend + nginx config deployed'"

      # ── Health check ──────────────────────────────────────────────────────────
      - name: Health check
        run: |
          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            echo "Waiting 60s for backend services to stabilize..."
            sleep 60
          else
            echo "Frontend-only deploy, waiting 5s..."
            sleep 5
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.EC2_HOST }}/api/auth/login \
            -X POST -H "Content-Type: application/json" \
            -d '{"username":"invalid","password":"invalid"}')
          echo "Auth endpoint HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "400" ]; then
            echo "Health check PASSED"
          else
            echo "Health check FAILED (got $HTTP_STATUS)"
            exit 1
          fi
