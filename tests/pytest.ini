[pytest]
# Markers match the phases in the financial correctness plan, so a run can be
# scoped by risk: calc and recon are safe anywhere, void/concurrency/failure
# rewrite financial rows and are only ever safe against the disposable stack.
markers =
    calc: independent-oracle calculation checks
    recon: reconciliation and schema invariants
    positive: valid workflows and state transitions
    negative: invalid input, authorization, cross-tenant
    void: reversal and correction — DESTRUCTIVE
    concurrency: simultaneous operations and idempotency
    failure: injected failures and partial outages — DESTRUCTIVE

testpaths = e2e oracle
python_files = test_*.py
addopts = --strict-markers -ra
