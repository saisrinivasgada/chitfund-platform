spring:
  application:
    name: management-service

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chitwise_management}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:chitfund}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: VARCHAR

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  websocket:
    allowed-origins: >
      http://localhost:3000,
      http://localhost:5173,
      https://thechitwise.com,
      https://hub.thechitwise.com

cloud:
  aws:
    region:
      static: ${AWS_REGION:us-east-2}

server:
  port: 8091

hub:
  jwt:
    secret: ${MANAGEMENT_JWT_SECRET:management-service-jwt-secret-min-32-chars-dev}
    access-token-expiry-ms: ${MANAGEMENT_JWT_EXPIRY_MS:28800000}
    refresh-token-expiry-days: ${MANAGEMENT_REFRESH_TOKEN_EXPIRY_DAYS:30}

org:
  jwt:
    secret: ${JWT_SECRET}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  hub-url: ${HUB_URL:http://localhost:3000}
  internal-key: ${INTERNAL_SERVICE_KEY:chitfund-internal-service-key}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  message-delete-window-seconds: 300
  mail:
    from: ${MAIL_FROM:ChitWise <help@thechitwise.com>}
  email:
    enabled: ${EMAIL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true

logging:
  level:
    com.chitfund: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
