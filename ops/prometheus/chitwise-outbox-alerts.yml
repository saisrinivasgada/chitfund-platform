groups:
  - name: chitwise-outbox
    rules:
      - alert: ChitwiseOutboxDeliveryFailed
        expr: chitwise_outbox_failed_current > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} has failed financial-event deliveries"
          runbook: "ops/runbooks/outbox.md"

      - alert: ChitwiseOutboxBacklogStale
        expr: chitwise_outbox_oldest_unpublished_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} outbox has been blocked for over five minutes"
          runbook: "ops/runbooks/outbox.md"

      - alert: ChitwiseOutboxLeaseContention
        expr: increase(chitwise_outbox_stale_finalize_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} finalized an expired or reclaimed outbox lease"
          runbook: "ops/runbooks/outbox.md"

      - alert: ChitwiseAuditOutboxDeliveryFailed
        expr: chitwise_audit_outbox_failed_current > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} has permanently failed audit deliveries"
          runbook: "ops/runbooks/outbox.md#audit-evidence-alerts"

      - alert: ChitwiseAuditOutboxBacklogStale
        expr: chitwise_audit_outbox_oldest_unpublished_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} audit evidence has been blocked for over five minutes"
          runbook: "ops/runbooks/outbox.md#audit-evidence-alerts"

      - alert: ChitwiseAuditOutboxLeaseContention
        expr: increase(chitwise_audit_outbox_stale_finalize_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} finalized an expired or reclaimed audit-outbox lease"
          runbook: "ops/runbooks/outbox.md#audit-evidence-alerts"

      - alert: ChitwiseEventOutboxDeliveryFailed
        expr: chitwise_event_outbox_failed_current > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} has permanently failed domain-event deliveries"
          runbook: "ops/runbooks/outbox.md#shared-domain-event-alerts"

      - alert: ChitwiseEventOutboxBacklogStale
        expr: chitwise_event_outbox_oldest_unpublished_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} domain events have been blocked for over five minutes"
          runbook: "ops/runbooks/outbox.md#shared-domain-event-alerts"

      - alert: ChitwiseEventOutboxLeaseContention
        expr: increase(chitwise_event_outbox_stale_finalize_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} finalized an expired or reclaimed domain-event lease"
          runbook: "ops/runbooks/outbox.md#shared-domain-event-alerts"

      - alert: ChitwiseMoneyShadowMismatch
        expr: chitwise_money_shadow_mismatch > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.table }} decimal and paise values disagree"
          runbook: "ops/runbooks/admin-wallet-paise-migration.md"

      - alert: ChitwiseMoneyShadowIncompleteAfterBackfill
        expr: chitwise_money_shadow_missing{required="true"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.table }} has missing paise values after completeness was required"
          runbook: "ops/runbooks/admin-wallet-paise-migration.md"
