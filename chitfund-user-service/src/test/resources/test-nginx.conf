worker_processes  1;
error_log  /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log  /dev/stdout;
    server {
        listen 80;
        location / {
            # Replicate the production rule: always overwrite with TCP peer.
            # A client-supplied X-ChitWise-Client-IP is silently replaced.
            proxy_set_header X-ChitWise-Client-IP $remote_addr;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Remove any remaining client-supplied identity headers
            proxy_set_header X-Original-Forwarded-For "";
            proxy_pass http://backend:8000/;
        }
    }
}
