# Production profile overrides.
# All secrets MUST be injected from the secret manager — no fallback defaults.
# The application will refuse to start if any required secret is absent.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}

app:
  internal-key: ${INTERNAL_SERVICE_KEY}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC
    password: ${DB_PASSWORD}
