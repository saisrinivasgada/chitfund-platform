spring:
  application:
    name: user-service


  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chitfund_user}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:chitfund}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # WHY this setting?
        # Hibernate 6 defaults to BINARY(16) for UUID columns on MySQL.
        # Our Flyway migrations use VARCHAR(36) (human-readable, easier to debug).
        # This tells Hibernate to expect VARCHAR for UUID fields → schema validation passes.
        type:
          preferred_uuid_jdbc_type: VARCHAR

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-south-1}

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:86400000}
  refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}

offline:
  signing-secret: ${OFFLINE_SIGNING_SECRET:}
  signing-key-id: ${OFFLINE_SIGNING_KEY_ID:v1}
  previous-signing-keys: ${OFFLINE_PREVIOUS_SIGNING_KEYS:}
  legacy-signing-secret: ${OFFLINE_LEGACY_SIGNING_SECRET:}

app:
  management-service-url: ${MANAGEMENT_SERVICE_URL:http://localhost:8091}
  member-service-url: ${MEMBER_SERVICE_URL:http://localhost:8083}
  cookie:
    secure: ${COOKIE_SECURE:true}
  internal-key: ${INTERNAL_SERVICE_KEY:chitfund-internal-service-key}
  frontend-url: ${FRONTEND_URL:https://app.thechitwise.com}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
  audit-service-url: ${AUDIT_SERVICE_URL:http://localhost:8088}
  mail:
    from: ${MAIL_FROM:noreply@thechitwise.com}
  email:
    enabled: ${EMAIL_ENABLED:false}
    # SES identities and production-access approvals are regional. This may
    # deliberately differ from AWS_REGION, which controls Mumbai SQS.
    region: ${SES_REGION:${AWS_REGION:ap-south-1}}
  sms:
    enabled: ${SMS_ENABLED:false}
  otp:
    logging-enabled: ${OTP_LOGGING_ENABLED:false}
    max-per-phone-per-day: ${OTP_MAX_PER_DAY:50}
    cooldown:
      enabled: ${OTP_COOLDOWN_ENABLED:true}

whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:NOT_CONFIGURED}
  access-token: ${WHATSAPP_ACCESS_TOKEN:NOT_CONFIGURED}
  api-version: ${WHATSAPP_API_VERSION:NOT_CONFIGURED}
  otp-template-name: ${WHATSAPP_OTP_TEMPLATE_NAME:otp_verification}
  otp-template-lang: ${WHATSAPP_OTP_TEMPLATE_LANG:en_US}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true

logging:
  level:
    com.chitfund: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
