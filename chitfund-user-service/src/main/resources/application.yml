spring:
  application:
    name: user-service


  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chitfund_user}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:chitfund}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # WHY this setting?
        # Hibernate 6 defaults to BINARY(16) for UUID columns on MySQL.
        # Our Flyway migrations use VARCHAR(36) (human-readable, easier to debug).
        # This tells Hibernate to expect VARCHAR for UUID fields → schema validation passes.
        type:
          preferred_uuid_jdbc_type: VARCHAR

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@thechitwise.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:86400000}
  refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}

app:
  internal-key: ${INTERNAL_SERVICE_KEY:chitfund-internal-service-key}
  frontend-url: ${FRONTEND_URL:https://app.thechitwise.com}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
  audit-service-url: ${AUDIT_SERVICE_URL:http://localhost:8088}
  sms:
    enabled: false
  otp:
    max-per-phone-per-day: ${OTP_MAX_PER_DAY:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.chitfund: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
